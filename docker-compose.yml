version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: opportunity_finder_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opportunity_finder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opportunity_finder"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Task Queue Broker
  redis:
    image: redis:7-alpine
    container_name: opportunity_finder_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web-Based Database Management GUI (Adminer)
  adminer:
    image: adminer:latest
    container_name: opportunity_finder_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Web-Based Redis Data & Queue Dashboard (Redis Commander)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: opportunity_finder_redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
